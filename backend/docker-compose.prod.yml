# Production overrides for docker-compose
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  postgres:
    # Remove port exposure in production (only internal access)
    ports: []
    environment:
      POSTGRES_PASSWORD: fleet_password_2024  # Matches .env.docker / base docker-compose.yml
    networks:
      - backend-internal

  redis:
    # Remove port exposure in production
    ports: []
    networks:
      - backend-internal

  backend:
    build:
      target: production  # Use production stage
    # No env_file line here — Compose merges env_file lists across -f files,
    # so the base docker-compose.yml's `env_file: .env.docker` already applies.
    # The old .env.production reference here was the actual bug: Compose tried
    # to load BOTH files, and .env.production never existed on either server.
    environment:
      DATABASE_URL: postgresql://fleet_user:fleet_password_2024@postgres:5432/fleet_db
      DB_HOST: postgres
      DB_PORT: 5432
      ENVIRONMENT: production
    # Remove volume mounts (no hot reload in production)
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - backend-internal
      - frontend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

networks:
  backend-internal:
    driver: bridge
    internal: true  # No external access
  frontend:
    driver: bridge
